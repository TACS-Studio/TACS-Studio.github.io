<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>bill74186的工具站 - 桌面</title>
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;}
        body {background:linear-gradient(135deg,#f5f7fa 0%,#e8eff7 100%);min-height:100vh;padding:20px;}
        @media (prefers-color-scheme:dark) {body{background:linear-gradient(135deg,#121212 0%,#1e1e1e 100%);color:#e5e5e5;}}
        .header {text-align:center;padding:30px 0;border-bottom:1px solid #eee;margin-bottom:30px;}
        @media (prefers-color-scheme:dark) {.header{border-bottom-color:#333;}}
        .header h1 {color:#409eff;font-size:28px;margin-bottom:8px;}
        .header p {color:#606266;font-size:16px;}
        @media (prefers-color-scheme:dark) {.header p{color:#a0a0a0;}}
        .desktop {max-width:1000px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:25px;padding:10px;}
        .app-icon {display:flex;flex-direction:column;align-items:center;cursor:pointer;transition:all .2s;padding:15px 10px;border-radius:12px;}
        .app-icon:hover {background:rgba(64,158,255,.08);transform:translateY(-3px);}
        @media (prefers-color-scheme:dark) {.app-icon:hover{background:rgba(64,158,255,.15);}}
        .icon-box {width:60px;height:60px;border-radius:16px;display:flex;align-items:center;justify-content:center;margin-bottom:10px;font-size:28px;color:#fff;}
        .icon-firewall {background:linear-gradient(135deg,#f56c6c,#ff8a80);}
        .app-name {font-size:14px;color:#303133;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%;}
        @media (prefers-color-scheme:dark) {.app-name{color:#e5e5e5;}}
        .footer {text-align:center;padding:40px 20px 20px;color:#909399;font-size:13px;}
        .footer a {color:#409eff;text-decoration:none;}
        /* 拦截页样式（二合一，不新建文件） */
        .intercept-overlay {position:fixed;top:0;left:0;width:100vw;height:100vh;background:var(--bg-page);z-index:99999;display:none;align-items:center;justify-content:center;padding:20px;}
        .intercept-card {width:100%;max-width:600px;background:#fff;border-radius:24px;box-shadow:0 8px 30px rgba(0,0,0,.1);padding:40px 30px;text-align:center;}
        @media (prefers-color-scheme:dark) {.intercept-card{background:#1a1a1a;}}
        .error-icon {width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,var(--danger),#ff6b6b);display:flex;align-items:center;justify-content:center;margin:0 auto 25px;font-size:40px;color:#fff;}
        h1.intercept-title {color:#f56c6c;font-size:2.5rem;font-weight:800;margin-bottom:15px;}
        .intercept-reason {background:rgba(245,108,108,.1);border-left:4px solid var(--danger);padding:15px 20px;margin:0 0 30px;text-align:left;}
        .intercept-reason .reason-text {font-weight:600;color:var(--danger);}
        .btn-group {display:flex;gap:15px;justify-content:center;flex-wrap:wrap;}
        .btn {padding:12px 24px;border-radius:10px;font-size:.95rem;font-weight:500;cursor:pointer;border:none;min-height:48px;}
        .btn-primary {background:#409eff;color:#fff;}
        .btn-back {background:#f5f5f5;color:#606266;}
        @media (max-width:480px) {.desktop{grid-template-columns:repeat(3,1fr);gap:15px;}.btn-group{flex-direction:column;}.btn{width:100%;}}
    </style>
</head>
<body>
<!-- 桌面（首页） -->
<div class="header">
    <h1>bill74186的工具站</h1>
    <p>个人工具集合 | 静态防火墙防护中</p>
</div>

<div class="desktop">
    <div class="app-icon" onclick="openFirewall()">
        <div class="icon-box icon-firewall">
            <i class="fa-solid fa-shield-halved"></i>
        </div>
        <div class="app-name">静态防火墙</div>
    </div>
    <!-- 其他占位图标，按需加 -->
    <div class="app-icon" onclick="alert('开发中')">
        <div class="icon-box" style="background:linear-gradient(135deg,#409eff,#66b1ff)">
            <i class="fa-solid fa-wrench"></i>
        </div>
        <div class="app-name">实用工具</div>
    </div>
    <div class="app-icon" onclick="alert('开发中')">
        <div class="icon-box" style="background:linear-gradient(135deg,#67c23a,#85ce61)">
            <i class="fa-solid fa-sticky-note"></i>
        </div>
        <div class="app-name">简易笔记</div>
    </div>
</div>

<div class="footer">
    © 2026 bill74186 | 个人工具站<br>静态防火墙防护中
</div>

<!-- 拦截页（二合一，隐藏状态） -->
<div class="intercept-overlay" id="interceptOverlay">
    <div class="intercept-card">
        <div class="error-icon">
            <i class="fa-solid fa-shield-halved"></i>
        </div>
        <h1 class="intercept-title">访问已被拦截</h1>
        <p>本站静态防火墙检测到异常访问，已自动拦截</p>
        <div class="intercept-reason">
            <p><strong>拦截原因：</strong><span class="reason-text" id="reasonText">未知异常访问</span></p>
        </div>
        <div class="btn-group">
            <button class="btn btn-primary" onclick="closeIntercept()">返回桌面</button>
            <button class="btn btn-back" onclick="window.history.back()">返回上一页</button>
        </div>
    </div>
</div>

<!-- 引入现有防火墙脚本（直接用你改好的firewall.js） -->
<script src="./firewall.js"></script>
<script>
// 桌面→防火墙触发
function openFirewall() {
    // 模拟异常访问，触发拦截
    sessionStorage.setItem('firewall_intercept_reason', '防火墙测试触发');
    showIntercept();
}
// 显示拦截页
function showIntercept() {
    document.getElementById('interceptOverlay').style.display = 'flex';
    const reason = sessionStorage.getItem('firewall_intercept_reason');
    if(reason) document.getElementById('reasonText').textContent = reason;
    sessionStorage.removeItem('firewall_intercept_reason');
}
// 关闭拦截页，返回桌面
function closeIntercept() {
    document.getElementById('interceptOverlay').style.display = 'none';
}
// 页面加载自动启动防火墙
window.addEventListener('DOMContentLoaded', () => {
    // 防火墙脚本自动执行，异常访问直接调用showIntercept()
    if (window.location.pathname.includes('firewall.html')) {
        const reason = sessionStorage.getItem('firewall_intercept_reason');
        if(reason) showIntercept();
    }
});
</script>
</body>
</html>
